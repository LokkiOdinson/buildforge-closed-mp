
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>BuildForge | Closed MP</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101820;
      color: #e9edf1;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 560px;
      margin: 24px;
      padding: 36px;
      background: #1b2632;
      border: 1px solid #35475a;
      border-radius: 12px;
    }
    h1 { margin-top: 0; }
    p { line-height: 1.6; color: #bbc9d6; }
    small { color: #89a6be; }
  </style>
</head>
<body>
  <main>
    <h1>BuildForge</h1>
    <p>Closed Multiplayer Update Channel</p>
    <p>
      This endpoint is reserved for digitally signed
      application update metadata.
    </p>
    <p>
      No installers, source code, or private signing
      keys are hosted here.
    </p>
    <small>Update channel setup in progress.</small>
  </main>
</body>
</html>
